<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>町内会 会計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DotGothic16&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* =========================================================
   アプリアイコン・PWAマニフェスト・Service Worker
   ========================================================= */
const APP_ICON_SVG = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<rect width="100" height="100" rx="14" fill="#FBF6EC"/>
<rect x="18" y="14" width="52" height="70" rx="3" fill="#fff" stroke="#3A322A" stroke-width="3"/>
<line x1="28" y1="30" x2="60" y2="30" stroke="#3A322A" stroke-width="3"/>
<line x1="28" y1="41" x2="60" y2="41" stroke="#3A322A" stroke-width="3"/>
<line x1="28" y1="52" x2="50" y2="52" stroke="#3A322A" stroke-width="3"/>
<circle cx="70" cy="68" r="17" fill="#FBF6EC" stroke="#B4432C" stroke-width="3"/>
<text x="70" y="73.5" font-size="14" text-anchor="middle" fill="#B4432C" font-family="serif" font-weight="bold">会計</text>
</svg>`.trim();
function svgDataUrl(svg){ return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))); }
const ICON_URL = svgDataUrl(APP_ICON_SVG);
function addLink(rel, href){ const l=document.createElement('link'); l.rel=rel; l.href=href; document.head.appendChild(l); }
function addMeta(name, content){ const m=document.createElement('meta'); m.name=name; m.content=content; document.head.appendChild(m); }
addLink('icon', ICON_URL);
addLink('apple-touch-icon', ICON_URL);
const manifest = {
  name:"町内会 会計簿", short_name:"会計簿", start_url:".", display:"standalone",
  background_color:"#FBF6EC", theme_color:"#B4432C",
  icons:[{src:ICON_URL,sizes:"192x192",type:"image/svg+xml",purpose:"any"},{src:ICON_URL,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]
};
addLink('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));
addMeta('apple-mobile-web-app-capable','yes');
addMeta('apple-mobile-web-app-status-bar-style','black-translucent');
addMeta('apple-mobile-web-app-title','会計簿');
addMeta('theme-color','#B4432C');
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{});";
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'text/javascript'}))).catch(()=>{});
  });
}
</script>

<style>
:root{
  --paper:#FBF6EC; --card:#FFFDF8; --ink:#3A322A; --ink-soft:#8A7F6E;
  --stamp-red:#B4432C; --stamp-navy:#2E5E7C; --moss:#3E7C6B; --amber:#B47C2C;
  --line:#E4DBC8; --tint:#F4EEDD;
  --shadow:0 2px 10px rgba(58,50,42,0.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; -webkit-font-smoothing:antialiased;}
body{
  min-height:100vh; min-height:100dvh; padding-bottom:80px;
  background-image:
    radial-gradient(circle at 15% 8%, rgba(180,67,44,0.04), transparent 40%),
    repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(58,50,42,0.025) 39px);
}
h1,h2,h3{font-family:'Shippori Mincho',serif; margin:0; font-weight:700;}
.num{font-family:'DotGothic16',monospace;}
button{font-family:inherit; cursor:pointer; color:inherit;}
button:disabled{opacity:.5; cursor:default;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--stamp-navy); outline-offset:2px;}

/* header */
.app-header{position:sticky; top:0; z-index:20; background:var(--paper); padding:calc(12px + env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:8px; min-width:0;}
.brand .mark{width:32px; height:32px; border-radius:50%; border:2px solid var(--stamp-red); color:var(--stamp-red); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; transform:rotate(-8deg); flex-shrink:0; font-family:'Shippori Mincho',serif;}
.brand h1{font-size:18px; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand .org{font-size:10.5px; color:var(--ink-soft);}
.user-chip{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft); flex-shrink:0;}
.role-badge{border:1.5px solid var(--stamp-navy); color:var(--stamp-navy); border-radius:4px; padding:1px 6px; font-weight:700; font-size:10.5px;}
.icon-btn{background:none; border:none; color:var(--ink-soft); font-size:19px; padding:4px;}

main{max-width:600px; margin:0 auto; padding:14px 14px 24px;}
.screen{display:none;}
.screen.active{display:block; animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){ .screen.active{animation:none;} }

/* 年度バー */
.fy-nav{display:flex; align-items:center; justify-content:center; gap:14px; margin:0 auto 12px; max-width:600px;}
.fy-nav button{background:none; border:none; font-size:18px; color:var(--ink-soft); padding:4px 12px;}
.fy-nav .fy-label{font-family:'Shippori Mincho',serif; font-size:17px; font-weight:700; text-align:center;}
.fy-nav .fy-sub{display:block; font-family:'Zen Kaku Gothic New',sans-serif; font-size:10.5px; color:var(--ink-soft); font-weight:400;}

/* 全面メッセージ画面 */
.center-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:78vh; text-align:center; gap:16px; padding:0 22px;}
.mark-big{width:78px; height:78px; border-radius:50%; border:3px solid var(--stamp-red); color:var(--stamp-red); display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho',serif; font-size:15px; font-weight:700; transform:rotate(-6deg); line-height:1.15;}
.center-wrap p{color:var(--ink-soft); font-size:13.5px; line-height:1.8; max-width:340px; margin:0;}
.google-btn{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 22px; font-size:14.5px; font-weight:700; box-shadow:var(--shadow);}
.google-btn svg{width:18px; height:18px;}
.text-link{background:none; border:none; color:var(--stamp-navy); font-size:13px; text-decoration:underline; padding:6px;}

/* 伝票 */
.slip{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 13px 14px; margin-bottom:10px; box-shadow:var(--shadow); position:relative; overflow:hidden; cursor:pointer;}
.slip::before{content:""; position:absolute; left:0; right:0; bottom:-1px; height:8px; background-image:radial-gradient(circle at 8px 0, transparent 6px, var(--paper) 6.5px); background-size:16px 10px; background-repeat:repeat-x;}
.slip.income{border-left:4px solid var(--stamp-navy);}
.slip-row{display:flex; gap:10px; align-items:flex-start;}
.slip-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.slip-title{font-weight:700; font-size:14.5px; line-height:1.4;}
.slip-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.slip-amount{font-family:'DotGothic16',monospace; font-size:19px; white-space:nowrap;}
.slip-amount.in{color:var(--stamp-navy);}
.slip-memo{font-size:12px; color:var(--ink-soft); margin-top:5px; line-height:1.5;}
.slip-photo-thumb{width:46px; height:46px; border-radius:4px; object-fit:cover; border:1px solid var(--line); flex-shrink:0; background:#eee;}
.voucher{font-family:'DotGothic16',monospace; font-size:11px; color:var(--stamp-red); border:1.5px solid var(--stamp-red); border-radius:3px; padding:0 5px; display:inline-block; transform:rotate(-2deg); margin-right:6px;}
.tags{margin-top:7px; display:flex; flex-wrap:wrap; gap:5px;}
.stamp-tag{display:inline-flex; align-items:center; gap:3px; font-size:10.5px; font-weight:700; border:1.5px solid; border-radius:20px; padding:1px 9px;}
.stamp-tag.fill{color:#fff !important;}

/* 一覧コントロール */
.filter-bar{display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none;}
.filter-bar::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; font-size:12.5px; padding:6px 13px; border-radius:20px; border:1.5px solid var(--line); color:var(--ink-soft); background:#fff; font-weight:500;}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.chip .cnt{font-family:'DotGothic16',monospace; margin-left:4px;}
.search-row{display:flex; gap:8px; margin-bottom:10px;}
.search-row input, .search-row select{flex:1; min-width:0; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit; background:#fff; color:var(--ink);}
.month-head{font-family:'Shippori Mincho',serif; font-weight:700; font-size:13.5px; margin:16px 2px 8px; display:flex; justify-content:space-between; color:var(--ink);}
.month-head .num{font-size:12px; color:var(--ink-soft);}

.summary-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 8px; margin-bottom:12px;}
.summary-strip > div{text-align:center; border-right:1px dashed var(--line); padding:0 4px;}
.summary-strip > div:last-child{border-right:none;}
.summary-strip .lbl{font-size:10.5px; color:var(--ink-soft);}
.summary-strip .val{font-family:'DotGothic16',monospace; font-size:clamp(12px,3.4vw,16px); margin-top:3px; white-space:nowrap;}
.summary-strip .val.big{font-size:clamp(13px,3.9vw,19px);}

.empty{text-align:center; padding:44px 20px; color:var(--ink-soft); font-size:13px; line-height:1.8;}
.empty .mark-big{margin:0 auto 12px; width:56px; height:56px; font-size:11px;}

/* パネル・通知 */
.panel{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow);}
.panel h3{font-size:14.5px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline;}
.panel h3 small{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:400; font-size:11px; color:var(--ink-soft);}
.notice{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--stamp-red); border-radius:6px; padding:11px 12px; margin-bottom:8px; width:100%; text-align:left; font-size:13.5px;}
.notice.navy{border-left-color:var(--stamp-navy);}
.notice.moss{border-left-color:var(--moss);}
.notice.amber{border-left-color:var(--amber);}
.notice .n-body{flex:1;}
.notice .n-val{font-family:'DotGothic16',monospace; font-size:15px; white-space:nowrap;}
.notice .n-sub{display:block; font-size:11px; color:var(--ink-soft); margin-top:1px;}

.bar-row{margin-bottom:10px;}
.bar-row .bl{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; gap:8px;}
.bar-row .bl .num{font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
.bar{height:8px; background:var(--tint); border-radius:4px; overflow:hidden; position:relative;}
.bar > i{display:block; height:100%; border-radius:4px;}
.bar.over > i{background:var(--stamp-red) !important;}

.progress-ring{display:flex; align-items:center; gap:12px;}
.progress-ring .pct{font-family:'DotGothic16',monospace; font-size:26px;}

/* 精算 */
.person-row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:8px; width:100%; text-align:left;}
.person-row .avatar{width:38px; height:38px; border-radius:50%; background:var(--tint); display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho',serif; font-weight:700; flex-shrink:0;}
.person-row .p-body{flex:1; min-width:0;}
.person-row .p-name{font-weight:700; font-size:14.5px;}
.person-row .p-sub{font-size:11.5px; color:var(--ink-soft);}
.person-row .p-amt{font-family:'DotGothic16',monospace; font-size:16px; text-align:right; white-space:nowrap;}
.direction{font-size:10.5px; display:block; font-family:'Zen Kaku Gothic New',sans-serif; color:var(--ink-soft);}
.check-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px dashed var(--line); font-size:13px;}
.check-row input{width:20px; height:20px; accent-color:var(--stamp-red); flex-shrink:0;}
.check-row .c-body{flex:1; min-width:0;}
.check-row .c-amt{font-family:'DotGothic16',monospace; white-space:nowrap;}
.net-box{text-align:center; border:2px solid var(--ink); border-radius:8px; padding:14px; margin:14px 0; background:#fff;}
.net-box .d{font-size:13px;}
.net-box .v{font-family:'DotGothic16',monospace; font-size:28px; margin-top:4px;}
.settle-card{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:8px;}
.settle-card .s-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}

/* FAB */
.fab{position:fixed; right:20px; bottom:calc(88px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; background:var(--stamp-red); color:#fff; border:none; font-size:26px; box-shadow:0 4px 14px rgba(180,67,44,0.4); display:flex; align-items:center; justify-content:center; z-index:30;}

/* bottom nav */
.bottom-nav{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); display:flex; z-index:25; padding-bottom:env(safe-area-inset-bottom);}
.bottom-nav button{flex:1; background:none; border:none; padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-soft); font-size:10.5px; position:relative;}
.bottom-nav button.active{color:var(--stamp-red);}
.bottom-nav svg{width:20px; height:20px;}
.bottom-nav .dot{position:absolute; top:5px; left:calc(50% + 8px); min-width:16px; height:16px; border-radius:8px; background:var(--stamp-red); color:#fff; font-size:10px; line-height:16px; padding:0 4px; font-family:'DotGothic16',monospace;}

/* form */
.form-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px;}
.field{margin-bottom:15px;}
.field > label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:500;}
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=password], .field input[type=email], .field textarea, .field select{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:11px 12px; font-size:15px; font-family:inherit; background:#fff; color:var(--ink);}
.field textarea{resize:vertical; min-height:56px;}
.amount-input{font-family:'DotGothic16',monospace !important; font-size:22px !important;}
.seg{display:flex; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden;}
.seg button{flex:1; border:none; background:#fff; padding:10px; font-weight:700; font-size:14px;}
.seg button.sel{background:var(--ink); color:#fff;}
.cat-picker{display:flex; gap:7px; flex-wrap:wrap;}
.cat-opt{border:2px solid var(--line); border-radius:20px; padding:6px 13px; font-size:12.5px; font-weight:700; background:#fff; color:var(--ink-soft);}
.cat-opt.sel{color:#fff;}
.cat-opt .flag{font-size:10px; font-weight:500; margin-left:4px; opacity:.85;}
.photo-strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
.photo-item{position:relative; flex-shrink:0;}
.photo-item img{height:120px; border-radius:6px; border:1px solid var(--line); display:block;}
.photo-item button{position:absolute; top:4px; right:4px; width:26px; height:26px; border-radius:50%; border:none; background:rgba(58,50,42,.75); color:#fff; font-size:14px;}
.photo-empty{border:2px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--ink-soft); font-size:12.5px; width:100%;}
.check-line{display:flex; align-items:center; gap:8px; font-size:13.5px;}
.check-line input{width:18px; height:18px; accent-color:var(--stamp-red);}
.btn-row{display:flex; gap:10px; margin-top:6px;}
.btn{flex:1; border:none; border-radius:8px; padding:13px; font-size:14.5px; font-weight:700;}
.btn.sm{padding:9px 12px; font-size:13px; flex:0 0 auto;}
.btn-primary{background:var(--stamp-red); color:#fff;}
.btn-navy{background:var(--stamp-navy); color:#fff;}
.btn-moss{background:var(--moss); color:#fff;}
.btn-ghost{background:#fff; border:1px solid var(--line); color:var(--ink-soft);}
.btn-danger{background:#fff; border:1px solid var(--stamp-red); color:var(--stamp-red);}
.full{width:100%;}

/* 詳細 */
.detail-photos img{width:100%; border-radius:8px; border:1px solid var(--line); margin-bottom:8px; display:block;}
.kv{display:grid; grid-template-columns:96px 1fr; gap:8px 12px; font-size:13.5px; line-height:1.5;}
.kv dt{color:var(--ink-soft); font-size:12px; padding-top:1px;}
.kv dd{margin:0; word-break:break-word;}
.big-amount{font-family:'DotGothic16',monospace; font-size:30px; text-align:center; margin:4px 0 12px;}
.audit-box{border:1.5px dashed var(--stamp-navy); border-radius:8px; padding:12px; background:#fff;}
.history{font-size:11.5px; color:var(--ink-soft); line-height:1.8;}

/* 管理リスト */
.cat-row{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin-bottom:7px;}
.cat-dot{width:14px; height:14px; border-radius:50%; flex-shrink:0;}
.cat-row .cname{flex:1; font-size:13.5px; font-weight:700; min-width:0;}
.cat-row .cname small{display:block; font-weight:400; font-size:11px; color:var(--ink-soft);}
.cat-row.inactive{opacity:.45;}
.cat-row button.lnk{background:none; border:none; color:var(--ink-soft); font-size:12.5px; padding:4px;}
.cat-row input.budget{width:108px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-family:'DotGothic16',monospace; font-size:14px; text-align:right;}
.cat-row select{border:1px solid var(--line); border-radius:6px; padding:6px; font-family:inherit; font-size:12.5px; max-width:130px; background:#fff;}
.color-swatches{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{width:28px; height:28px; border-radius:50%; border:2px solid transparent;}
.swatch.sel{border-color:var(--ink);}
.inline-add{display:flex; gap:8px; margin-top:8px;}
.inline-add input, .inline-add select{flex:1; min-width:0; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit; background:#fff;}

.section-title{font-size:15px; margin:4px 0 10px; letter-spacing:.03em;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.65;}
.toast{position:fixed; bottom:calc(100px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:13px; padding:10px 20px; border-radius:20px; z-index:60; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s; max-width:88vw; text-align:center;}
.toast.show{opacity:1;}

/* 公開レポート */
.pub-head{text-align:center; padding:26px 16px 8px;}
.pub-head .org{font-family:'Shippori Mincho',serif; font-size:24px; font-weight:700;}
.pub-head .ttl{color:var(--ink-soft); font-size:13px; margin-top:4px;}
.audited{display:inline-block; margin-top:12px; border:2.5px solid var(--moss); color:var(--moss); border-radius:6px; padding:4px 12px; font-weight:700; font-size:12.5px; transform:rotate(-3deg);}
.mbars{display:flex; align-items:flex-end; gap:4px; height:120px; padding-top:8px;}
.mbars .mb{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:3px;}
.mbars .mb i{display:block; width:100%; background:var(--stamp-red); border-radius:3px 3px 0 0; min-height:1px; opacity:.85;}
.mbars .mb span{font-size:9.5px; color:var(--ink-soft);}
table.pub{border-collapse:collapse; width:100%; font-size:12.5px;}
table.pub td, table.pub th{padding:7px 6px; border-bottom:1px solid var(--line); text-align:left;}
table.pub td.r, table.pub th.r{text-align:right; font-family:'DotGothic16',monospace; white-space:nowrap;}
table.pub th{font-family:'Shippori Mincho',serif; background:var(--tint);}
.tbl-wrap{overflow-x:auto;}
</style>
</head>
<body>

<!-- 初期設定が未完了のとき -->
<div id="setupScreen" style="display:none;">
  <div class="center-wrap">
    <div class="mark-big">設定<br>待ち</div>
    <h1 style="font-size:20px;">Firebaseの設定が必要です</h1>

<script>
/* =========================================================
   Firebase 設定
   ※ 町内会用に新しく作成したFirebaseプロジェクトの値に置き換えてください。
     個人用プロジェクト（life--log等）と同居させると、セキュリティルールで
     会計データを守れなくなるため、専用プロジェクトを推奨します。
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCVbfpe_4HdY5J1_ccdAi6AFF-lS4pmZ6M",
  authDomain: "ogawa-machida.firebaseapp.com",
  // ↓ Realtime Database のURL（Firebaseコンソール＞Realtime Database の画面上部に表示されるURLと一致させてください）
  databaseURL: "https://ogawa-machida-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ogawa-machida",
  storageBucket: "ogawa-machida.firebasestorage.app",
  messagingSenderId: "864551639060",
  appId: "1:864551639060:web:0e3d1007b788433573ef01"
};
const CONFIGURED = !firebaseConfig.apiKey.startsWith('YOUR_');
const ROOT = 'chokai-kaikei';
let auth = null, db = null;
if (CONFIGURED) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.database();
}
const R = p => db.ref(`${ROOT}/${p}`);
const TS = () => firebase.database.ServerValue.TIMESTAMP;

/* ---------- 定数 ---------- */
const PALETTE = ['#B4432C','#2E5E7C','#7A8450','#9C6B3E','#7D5A8C','#3E7C6B','#B47C2C','#5E6B7C','#A0526B','#4F7F9E'];
const ROLES = {
  treasurer:{ name:'会計', desc:'すべての登録・承認・精算・設定' },
  auditor:  { name:'監査', desc:'全件の閲覧と監査チェック' },
  viewer:   { name:'役員', desc:'全件の閲覧のみ（会長など）' },
  payer:    { name:'支払者', desc:'自分の支出の申請と精算の確認' },
  pending:  { name:'承認待ち', desc:'' },
  removed:  { name:'利用停止', desc:'' }
};
const POSTS = ['会長','副会長','会計','庶務','書記','班長','防災支隊長','防犯部長','環境部長','体育部長','婦人部','子ども会','その他'];
const SETTLE_WAYS = ['現金手渡し','口座振込','その他'];

/* ---------- 状態 ---------- */
let me = null;                 // {uid,name,email,role,payerId}
let settings = { orgName:'町内会', fiscalStartMonth:4, opening:{}, publicDetail:'items' };
let accounts = [], methods = [], payers = [], members = [], storageTags = [];
let fyMap = {}, pendingMap = {}, mineMap = {};
let advances = [], settlements = [], logs = [], auditReports = {};
let curFY = null;
let listeners = [];
let currentScreen = 'homeScreen';
let bookFilter = { status:'all', q:'', account:'', method:'', payer:'' };
let auditFilter = 'todo';
let settleView = null;         // 精算画面で開いている支払者ID
let detailId = null;

/* ---------- ユーティリティ ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function yen(n){ return '¥' + (Number(n)||0).toLocaleString(); }
function pad(n,l=2){ return String(n).padStart(l,'0'); }
function localDate(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${Number(m)}/${Number(d)}`; }
function fmtDateFull(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${y}年${Number(m)}月${Number(d)}日`; }
function fmtTs(t){ if(!t) return ''; const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function startMonth(){ return Number(settings.fiscalStartMonth)||4; }
function fyOf(dateStr){ const [y,m]=dateStr.split('-').map(Number); return m >= startMonth() ? y : y-1; }
function fyRangeLabel(fy){
  const s=startMonth(); const endM = s===1 ? 12 : s-1; const endY = s===1 ? fy : fy+1;
  return `${fy}年${s}月〜${endY}年${endM}月`;
}
function fyMonths(fy){ const s=startMonth(); return Array.from({length:12},(_,i)=>{ const m=((s-1+i)%12)+1; const y = (s-1+i)>=12 ? fy+1 : fy; return {y,m,key:`${y}-${pad(m)}`}; }); }
function isStaff(){ return me && ['treasurer','auditor','viewer'].includes(me.role); }
function isT(){ return me && me.role==='treasurer'; }
function isA(){ return me && me.role==='auditor'; }
function isP(){ return me && me.role==='payer'; }
function accById(id){ return accounts.find(a=>a.id===id); }
function methodById(id){ return methods.find(m=>m.id===id); }
function payerById(id){ return payers.find(p=>p.id===id); }
function payerName(id){ const p=payerById(id); return p ? p.name : ''; }
function payerLabel(id){ const p=payerById(id); return p ? `${p.name}${p.post?`（${p.post}）`:''}` : ''; }
function needsSettle(e){ const m=methodById(e.methodId); return e.type==='expense' && !!(m && m.settle); }

let toastTimer;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2600); }
function $(id){ return document.getElementById(id); }
function hideAllRoots(){ ['setupScreen','loginScreen','pendingScreen','publicScreen','mainWrap'].forEach(id=>$(id).style.display='none'); }

/* すべての帳簿データ（会計・監査・役員は年度分＋未精算分、支払者は自分の分） */
function allEntries(){
  if (isP()) return Object.values(mineMap);
  return Object.values({...fyMap, ...pendingMap});
}
function entryById(id){ return fyMap[id] || pendingMap[id] || mineMap[id] || null; }
function fyEntries(){ return allEntries().filter(e => e.fy === curFY); }
function approvedFY(){ return fyEntries().filter(e => e.status==='approved'); }

/* 操作履歴（追記のみ。ルールで書き換え・削除できないようにしている） */
function writeLog(action, e, detail){
  return R('log').push().set({
    at:TS(), uid:me.uid, name:me.name, action,
    voucherNo: e ? (e.voucherNo||'') : '', amount: e ? (Number(e.amount)||0) : 0,
    detail: detail||''
  }).catch(()=>{});
}

/* ---------- 起動 ---------- */
const params = new URLSearchParams(location.search);
if (!CONFIGURED) { hideAllRoots(); $('setupScreen').style.display='block'; }
else if (params.get('view')==='public') { openPublic(); }
else { startAuth(); }

function startAuth(){
  $('googleLoginBtn').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(()=>showToast('ログインに失敗しました'));
  $('logoutBtn').onclick = () => { if (confirm('ログアウトしますか？')) auth.signOut(); };
  auth.onAuthStateChanged(async user => {
    detachAll();
    if (!user) { me=null; hideAllRoots(); $('loginScreen').style.display='block'; return; }
    try { await enterAs(user); } catch(e){ console.error(e); showToast('読み込みに失敗しました'); }
  });
}

async function enterAs(user){
  const mref = R(`members/${user.uid}`);
  let snap = await mref.get();
  if (!snap.exists()) {
    const initSnap = await R('settings/initialized').get();
    if (!initSnap.val()) {
      if (!confirm('この会計簿はまだ使われていません。あなたを「会計」担当として初期設定を行いますか？')) { auth.signOut(); return; }
      await mref.set({ name:user.displayName||'会計', email:user.email||'', role:'treasurer', createdAt:TS() });
      await seedDefaults();
    } else {
      await mref.set({ name:user.displayName||'', email:user.email||'', role:'pending', requestedAt:TS() });
    }
  }
  // 自分の権限の変化をリアルタイムで反映
  const h = mref.on('value', s => {
    const v = s.val(); if (!v) return;
    const prevRole = me && me.role, prevPayer = me && me.payerId;
    me = { uid:user.uid, ...v };
    if (v.role==='pending' || v.role==='removed') {
      detachData(); hideAllRoots();
      $('pendingText').innerHTML = v.role==='removed'
        ? 'このアカウントは利用停止中です。会計担当にお問い合わせください。'
        : `${esc(v.name)} さん（${esc(v.email)}）の利用申請を受け付けました。<br>会計担当が権限を設定すると自動で画面が切り替わります。`;
      $('pendingScreen').style.display='block';
      return;
    }
    if (prevRole !== v.role || prevPayer !== v.payerId) { detachData(); attachData(); buildNav(); }
    hideAllRoots(); $('mainWrap').style.display='block';
    $('roleBadge').textContent = ROLES[v.role]?.name || '';
    $('userName').textContent = v.name || '';
    renderAll();
  });
  listeners.push(()=>mref.off('value', h));
}

async function seedDefaults(){
  const ups = {};
  ups['settings'] = { initialized:true, orgName:'〇〇町内会', fiscalStartMonth:4, publicDetail:'items', createdAt:TS() };
  const exp = ['事務費','会議費','行事費','防災・防犯費','環境美化費','慶弔費','通信運搬費','備品費','助成・寄付金','雑費'];
  const inc = ['会費収入','補助金・助成金','寄付金','雑収入','前年度繰越金'];
  exp.forEach((n,i)=>{ ups[`accounts/${R('accounts').push().key}`] = {name:n,type:'expense',color:PALETTE[i%PALETTE.length],active:true,order:i}; });
  inc.filter(n=>n!=='前年度繰越金').forEach((n,i)=>{ ups[`accounts/${R('accounts').push().key}`] = {name:n,type:'income',color:PALETTE[(i+3)%PALETTE.length],active:true,order:100+i}; });
  const ms = [
    {name:'町内会口座から振込', use:'expense', settle:false},
    {name:'会計の手元現金', use:'expense', settle:false},
    {name:'町内会名義のカード・QR', use:'expense', settle:false},
    {name:'立替（現金）', use:'expense', settle:true},
    {name:'立替（個人のクレジットカード）', use:'expense', settle:true},
    {name:'立替（個人のQRコード決済）', use:'expense', settle:true},
    {name:'仮払金から支払', use:'expense', settle:true},
    {name:'現金で受取', use:'income', settle:false},
    {name:'口座に入金', use:'income', settle:false}
  ];
  ms.forEach((m,i)=>{ ups[`methods/${R('methods').push().key}`] = {...m, active:true, order:i}; });
  await db.ref(ROOT).update(ups);
}

/* ---------- データ購読 ---------- */
function on(ref, fn){ const h = ref.on('value', fn, err=>console.error(err)); listeners.push(()=>ref.off('value', h)); }
let dataListeners = [];
function onData(ref, fn){ const h = ref.on('value', fn, err=>{ console.error(err); }); dataListeners.push(()=>ref.off('value', h)); }
function detachData(){ dataListeners.forEach(f=>f()); dataListeners=[]; fyMap={}; pendingMap={}; mineMap={}; advances=[]; settlements=[]; logs=[]; members=[]; }
function detachAll(){ detachData(); listeners.forEach(f=>f()); listeners=[]; }
function asList(v){ return Array.isArray(v) ? v : Object.values(v||{}); }
function toArr(val){ return Object.entries(val||{}).map(([id,v])=>({id,...v})); }

function attachData(){
  if (curFY===null) curFY = null; // 設定読込後に決定
  onData(R('settings'), s => {
    settings = { ...settings, ...(s.val()||{}) };
    if (curFY===null) { curFY = fyOf(localDate()); subscribeFY(); }
    $('headerOrg').textContent = settings.orgName || '';
    renderAll();
  });
  onData(R('accounts'), s => { accounts = toArr(s.val()).sort((a,b)=>(a.order||0)-(b.order||0)); renderAll(); });
  onData(R('methods'),  s => { methods  = toArr(s.val()).sort((a,b)=>(a.order||0)-(b.order||0)); renderAll(); });
  onData(R('payers'),   s => { payers   = toArr(s.val()).sort((a,b)=>(a.order||0)-(b.order||0) || (a.name||'').localeCompare(b.name||'','ja')); renderAll(); });
  onData(R('storageTags'), s => { storageTags = toArr(s.val()).map(t=>t.name).sort((a,b)=>a.localeCompare(b,'ja')); });
  onData(R('auditReports'), s => { auditReports = s.val()||{}; renderAll(); });

  if (isStaff()) {
    onData(R('entries').orderByChild('settleState').equalTo('pending'), s => { pendingMap = objWithIds(s.val()); renderAll(); });
    onData(R('advances'), s => { advances = toArr(s.val()); renderAll(); });
    onData(R('settlements'), s => { settlements = toArr(s.val()).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); renderAll(); });
    onData(R('members'), s => { members = toArr(s.val()); renderAll(); });
    onData(R('log').limitToLast(300), s => { logs = toArr(s.val()).sort((a,b)=>(b.at||0)-(a.at||0)); if (currentScreen==='auditScreen') renderAudit(); });
  } else if (isP() && me.payerId) {
    onData(R('entries').orderByChild('payerId').equalTo(me.payerId), s => { mineMap = objWithIds(s.val()); renderAll(); });
    onData(R('advances').orderByChild('payerId').equalTo(me.payerId), s => { advances = toArr(s.val()); renderAll(); });
    onData(R('settlements').orderByChild('payerId').equalTo(me.payerId), s => { settlements = toArr(s.val()).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); renderAll(); });
  }
  if (curFY!==null) subscribeFY();
}
function objWithIds(val){ const o={}; Object.entries(val||{}).forEach(([id,v])=>o[id]={id,...v}); return o; }

let fyOff = null;
function subscribeFY(){
  if (!isStaff() || curFY===null) return;
  if (fyOff) fyOff();
  const ref = R('entries').orderByChild('fy').equalTo(curFY);
  const h = ref.on('value', s => { fyMap = objWithIds(s.val()); renderAll(); }, err=>console.error(err));

/* =========================================================
   精算の計算
   net = 承認済みの未精算支出（立替・仮払消化）− 未精算の仮払金
   net > 0 … 会計が支払者へ支払う ／ net < 0 … 支払者が会計へ返金
   ========================================================= */
function payerBalance(pid){
  const pend = allEntries().filter(e=>e.payerId===pid && e.settleState==='pending');
  const approved = pend.filter(e=>e.status==='approved').sort((a,b)=>a.date<b.date?-1:1);
  const waiting = pend.filter(e=>e.status!=='approved');
  const advs = advances.filter(a=>a.payerId===pid && a.settleState==='pending').sort((a,b)=>a.date<b.date?-1:1);
  const spent = approved.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const adv = advs.reduce((s,a)=>s+(Number(a.amount)||0),0);
  return { pid, approved, waiting, advs, spent, adv, net: spent-adv, ready: approved.length>0 || advs.length>0 };
}
function settlePeople(){
  const ids = new Set();
  allEntries().forEach(e=>{ if (e.settleState==='pending' && e.payerId) ids.add(e.payerId); });
  advances.forEach(a=>{ if (a.settleState==='pending') ids.add(a.payerId); });
  return [...ids].map(payerBalance).sort((a,b)=>Math.abs(b.net)-Math.abs(a.net));
}
function directionText(net, name){
  if (net>0) return `会計 → ${name}さんへ支払い`;
  if (net<0) return `${name}さん → 会計へ返金`;
  return '差額なし（相殺）';
}

  if (e.status==='submitted') return `<span class="stamp-tag fill" style="background:var(--amber);border-color:var(--amber)">承認待ち</span>`;
  if (e.status==='returned') return `<span class="stamp-tag fill" style="background:var(--stamp-red);border-color:var(--stamp-red)">差戻し</span>`;

}
function settleTag(e){
  if (e.type!=='expense') return '';
  if (e.settleState==='pending') return `<span class="stamp-tag" style="border-color:var(--stamp-red);color:var(--stamp-red)">要精算</span>`;
  if (e.settleState==='settled') return `<span class="stamp-tag" style="border-color:var(--moss);color:var(--moss)">精算済</span>`;
  return '';
}
function auditTag(e){
  if (!e.audit) return '';
  if (e.auditStale) return `<span class="stamp-tag" style="border-color:var(--amber);color:var(--amber)">監査後に修正</span>`;
  if (e.audit.result==='ok') return `<span class="stamp-tag" style="border-color:var(--stamp-navy);color:var(--stamp-navy)">監査✓</span>`;
  return `<span class="stamp-tag fill" style="background:var(--stamp-navy);border-color:var(--stamp-navy)">監査指摘</span>`;

  const rows = t => accounts.filter(a=>a.type===t && (a.active || ap.some(e=>e.accountId===a.id))).map(a=>{

    const pct = budget ? Math.min(100, actual/budget*100) : 100;
    const over = budget && actual>budget;
    return `<div class="bar-row"><div class="bl"><span>${esc(a.name)}</span><span class="num">${yen(actual)}${budget?` ／ ${yen(budget)}（${Math.round(actual/budget*100)}%）`:'（予算未設定）'}</span></div>
      <div class="bar ${over&&t==='expense'?'over':''}"><i style="width:${pct}%;background:${a.color}"></i></div></div>`;
  }).join('');

function renderBookList(base){
  const f = bookFilter; const q = f.q.toLowerCase();
  let list = base.filter(e=>{
    if (f.status==='expense' && e.type!=='expense') return false;
    if (f.status==='income' && e.type!=='income') return false;
    if (['submitted','returned'].includes(f.status) && e.status!==f.status) return false;
    if (f.status==='pending' && e.settleState!=='pending') return false;
    if (f.status==='noReceipt' && !e.noReceipt) return false;
    if (f.account && e.accountId!==f.account) return false;
    if (f.method && e.methodId!==f.method) return false;
    if (f.payer && e.payerId!==f.payer) return false;
    if (q && ![e.payee,e.purpose,e.memo,e.voucherNo,payerName(e.payerId)].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> a.date===b.date ? ((b.voucherNo||'')>(a.voucherNo||'')?1:-1) : (a.date<b.date?1:-1));
  const inc = list.filter(e=>e.type==='income').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const exp = list.filter(e=>e.type==='expense').reduce((s,e)=>s+(Number(e.amount)||0),0);
  $('bookSummary').innerHTML = `<div><div class="lbl">件数</div><div class="val">${list.length}</div></div>
    <div><div class="lbl">収入</div><div class="val" style="color:var(--stamp-navy)">${yen(inc)}</div></div>
    <div><div class="lbl">支出</div><div class="val" style="color:var(--stamp-red)">${yen(exp)}</div></div>`;
  const wrap = $('bookList');
  if (!list.length) { wrap.innerHTML = `<div class="empty"><div class="mark-big">記録<br>なし</div>条件に合う記録はありません</div>`; return; }
  const groups = {};
  list.forEach(e=>{ const k=e.date.slice(0,7); (groups[k]=groups[k]||[]).push(e); });
  wrap.innerHTML = Object.entries(groups).map(([k,arr])=>{
    const [y,m]=k.split('-');
    const out = arr.filter(e=>e.type==='expense').reduce((s,e)=>s+(Number(e.amount)||0),0);
    return `<div class="month-head"><span>${y}年${Number(m)}月</span><span class="num">支出 ${yen(out)}</span></div>` + arr.map(slipHTML).join('');

async function handlePhoto(file){
  if (!file) return;
  if (formPhotos.length >= 3) { showToast('写真は3枚までです'); return; }
  try {
    const dataUrl = await compressImage(file, 1100, 0.65);
    formPhotos.push(dataUrl); photosChanged = true;
    renderPhotoStrip();
    if (formPhotos.length===1 && getApiKey()) runAi(dataUrl);
  } catch(e){ showToast('写真の読み込みに失敗しました'); }
}
function compressImage(src, maxSize, quality){
  return new Promise((resolve, reject) => {
    const go = url => {
      const img = new Image();
      img.onload = () => {
        let {width, height} = img;
        if (width>maxSize || height>maxSize) {
          if (width>height) { height=Math.round(height*maxSize/width); width=maxSize; }
          else { width=Math.round(width*maxSize/height); height=maxSize; }
        }
        const c = document.createElement('canvas'); c.width=width; c.height=height;
        c.getContext('2d').drawImage(img,0,0,width,height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject; img.src = url;
    };
    if (typeof src === 'string') go(src);
    else { const r=new FileReader(); r.onload=ev=>go(ev.target.result); r.onerror=reject; r.readAsDataURL(src); }
  });
}

/* ---------- AI読み取り（APIキーはこの端末のみに保存） ---------- */
const API_KEY_STORAGE = 'chokaiKaikei_claudeApiKey';
function getApiKey(){ try { return localStorage.getItem(API_KEY_STORAGE); } catch(e){ return null; } }
$('aiReadBtn').onclick = () => { if (formPhotos[0]) runAi(formPhotos[0]); };
async function runAi(dataUrl){
  const key = getApiKey();
  if (!key) { showToast('設定画面でClaude APIキーを登録するとAI読み取りが使えます'); return; }
  const btn = $('aiReadBtn'); const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'AIが読み取り中…';
  try {
    const comma = dataUrl.indexOf(',');
    const mediaType = dataUrl.slice(5, comma).split(';')[0] || 'image/jpeg';
    const accNames = accounts.filter(a=>a.type===formType && a.active).map(a=>a.name);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:1000,
        system:'あなたは町内会の会計担当を手伝うアシスタントです。レシート・領収書・振込控えの画像から情報を抽出し、JSONオブジェクトのみを出力します。前後の説明文やコードブロック記号は付けません。',
        messages:[{ role:'user', content:[
          { type:'image', source:{ type:'base64', media_type:mediaType, data:dataUrl.slice(comma+1) } },
          { type:'text', text:`次の形式のJSONのみで出力してください。\n{"date":"YYYY-MM-DD（不明ならnull）","payee":"店名・支払先（不明ならnull）","amount":税込合計の数値（不明なら0）,"items":"品目の簡潔なメモ（30文字程度）","account":"次の科目から最も近いもの：${accNames.join('、')}"}\n和暦は西暦に変換してください。` }
        ]}]
      })
    });
    if (!res.ok) throw new Error('API ' + res.status);
    const data = await res.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').replace(/```json|```/g,'').trim();
    const r = JSON.parse(text);
    if (r.date && r.date!=='null') $('fDate').value = r.date;
    if (r.payee && r.payee!=='null') $('fPayee').value = r.payee;
    if (Number(r.amount)) $('fAmount').value = Number(r.amount);
    if (r.items && !$('fMemo').value) $('fMemo').value = r.items;
    const acc = accounts.find(a=>a.type===formType && a.active && a.name===r.account);
    if (acc && !formAccount) { formAccount = acc.id; renderAccountPicker(); }
    showToast('読み取りました。内容を確認してから保存してください');
  } catch(e) {
    console.error(e);
    showToast(String(e.message).includes('401') ? 'APIキーが無効です。設定画面で登録し直してください' : '読み取りに失敗しました。手入力してください');
  } finally { btn.disabled=false; btn.textContent=orig; }
}

  const btn = $('formSaveBtn'); btn.disabled=true; btn.textContent='保存中…';
  try {

    const ref = editing ? R(`entries/${editing.id}`) : R('entries').push();

    if (!voucherNo) {
      const tx = await R(`counters/${fy}`).transaction(n => (n||0)+1);

    }
    let thumb = editing ? (editing.thumb||null) : null;

    const prev = editing || {};
    const status = isT() ? (prev.status==='submitted' ? 'submitted' : 'approved') : 'submitted';
    const data = {
      ...prev,
      type: formType, date, fy, voucherNo, amount,
      payee: $('fPayee').value.trim(), purpose: $('fPurpose').value.trim(), memo: $('fMemo').value.trim(),
      accountId: formAccount, methodId: formMethod, payerId: payerId || null,

      noReceipt, noReceiptReason: noReceipt ? $('fNoReceiptReason').value.trim() : '',

    };
    delete data.id;

    if (photosChanged) await R(`photos/${ref.key}`).set(formPhotos.length ? formPhotos : null);
    const st = data.storageLocation;

    writeLog(editing ? '修正' : (isP() ? '申請' : '登録'), data, editing ? diffText(prev, data) : `${data.purpose||data.payee}`);
    showToast(isP() ? '申請しました。会計の確認をお待ちください' : '保存しました');
    openDetail(ref.key, {...data, id:ref.key});
  } catch(e) {
    console.error(e); showToast('保存に失敗しました（権限を確認してください）');
  } finally { btn.disabled=false; btn.textContent='保存する'; }
};
function diffText(a,b){
  const labels = {date:'日付',amount:'金額',payee:'支払先',purpose:'用途',accountId:'科目',methodId:'支払方法',payerId:'支払者'};
  const out = [];
  Object.entries(labels).forEach(([k,l])=>{
    if ((a[k]||'') !== (b[k]||'')) {
      const f = v => k==='accountId' ? (accById(v)?.name||'') : k==='methodId' ? (methodById(v)?.name||'') : k==='payerId' ? payerName(v) : k==='amount' ? yen(v) : (v||'');
      out.push(`${l}：${f(a[k])}→${f(b[k])}`);
    }
  });
  if (a.photoCount!==b.photoCount) out.push('写真を変更');
  return out.join('／') || '内容の修正';
}

  if ($('dEdit')) $('dEdit').onclick = () => openForm(e);
  if ($('dDelete')) $('dDelete').onclick = () => deleteEntry(e);
  if ($('dApprove')) $('dApprove').onclick = () => approveEntry(e);
  if ($('dReturn')) $('dReturn').onclick = () => returnEntry(e);
  if ($('aOk')) $('aOk').onclick = () => auditEntry(e, 'ok');
  if ($('aIssue')) $('aIssue').onclick = () => auditEntry(e, 'issue');
  if ($('aResp')) $('aResp').onclick = async () => { await R(`entries/${e.id}/audit/response`).set($('auditResp').value.trim()); writeLog('監査回答', e, $('auditResp').value.trim()); showToast('回答を記録しました'); };

  if (e.photoCount) {
    const ck = `${e.id}:${e.updatedAt||''}`;
    let arr = photoCache[ck];
    if (!arr) {
      const s = await R(`photos/${e.id}`).get().catch(()=>null);
      arr = s ? asList(s.val()).filter(Boolean) : [];
      if (arr.length) photoCache[ck] = arr;
    }
    const box = $('detailPhotos');
    if (box) box.innerHTML = arr.length ? arr.map((p,i)=>`<img src="${p}" alt="証憑${i+1}">`).join('') : '<p class="hint">写真を読み込めませんでした</p>';
  }
}

async function approveEntry(e){
  await R(`entries/${e.id}`).update({
    status:'approved', returnReason:null,
    settleState: e.settleState==='settled' ? 'settled' : (needsSettle(e) ? 'pending' : 'none'),
    approvedBy: me.uid, approvedByName: me.name, approvedAt: TS()
  });
  writeLog('承認', e, `${payerName(e.payerId)} ${e.purpose||e.payee||''}`);
  showToast('承認しました');
  const next = fyEntries().find(x=>x.status==='submitted' && x.id!==e.id);
  if (next && confirm('次の承認待ちを開きますか？')) openDetail(next.id);
}
async function returnEntry(e){
  const reason = prompt('差し戻す理由を入力してください（支払者に表示されます）', '領収証の宛名を町内会名にしてもらってください');
  if (reason===null) return;
  await R(`entries/${e.id}`).update({ status:'returned', returnReason: reason.trim() || '内容を確認してください' });
  writeLog('差戻し', e, reason);
  showToast('差し戻しました');
}
async function deleteEntry(e){
  if (e.settleState==='settled') return showToast('精算済みの伝票は削除できません。先に精算を取り消してください');
  if (!confirm(`${e.voucherNo} を削除しますか？\n（削除した記録は操作履歴に残ります）`)) return;
  try {
    await R(`photos/${e.id}`).remove();
    await R(`entries/${e.id}`).remove();
    writeLog('削除', e, `${e.purpose||e.payee||''} ${yen(e.amount)}`);
    showToast('削除しました');
    showScreen(isP()?'homeScreen':'bookScreen');
  } catch(err){ console.error(err); showToast('削除できませんでした'); }
}
async function auditEntry(e, result){
  const comment = ($('auditComment')?.value||'').trim();
  if (result==='issue' && !comment) return showToast('指摘の内容を入力してください');
  await R(`entries/${e.id}/audit`).set({ result, comment, by:me.uid, byName:me.name, at:TS() });
  await R(`entries/${e.id}/auditStale`).set(false);
  writeLog(result==='ok'?'監査OK':'監査指摘', e, comment);
  showToast(result==='ok' ? '確認済みにしました' : '指摘を記録しました');
  const next = approvedFY().sort((a,b)=>(a.voucherNo||'')<(b.voucherNo||'')?-1:1).find(x=>(!x.audit || x.auditStale) && x.id!==e.id);
  if (next) openDetail(next.id); else showScreen('auditScreen');
}

        <span class="p-sub" style="display:block">立替 ${p.approved.length}件${p.advs.length?`・仮払 ${yen(p.adv)}`:''}${p.waiting.length?`・承認待ち ${p.waiting.length}件`:''}</span></span>
      <span class="p-amt">${p.ready?yen(Math.abs(p.net)):'－'}<span class="direction">${!p.ready?'承認待ちのみ':p.net>0?'会計から支払う':p.net<0?'返金を受け取る':'差額なし'}</span></span>

  html += `<div class="panel" style="margin-top:16px"><h3>仮払金を渡す <small>行事の前に現金を預けるとき</small></h3>
    <div class="field"><select id="advPayer" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:14px;background:#fff">
      <option value="">渡す相手を選ぶ</option>${payers.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(payerLabel(p.id))}</option>`).join('')}</select></div>
    <div class="inline-add" style="margin-top:0"><input type="date" id="advDate" value="${localDate()}"><input type="number" id="advAmount" placeholder="金額" inputmode="numeric" class="num"></div>
    <div class="inline-add"><input id="advMemo" placeholder="目的（例：夏祭り買い出し）"><button class="btn btn-navy sm" id="advAdd">記録</button></div>
    <p class="hint">渡した仮払金は、その人の精算時に使った金額と相殺されます。</p></div>`;

  html += `<h2 class="section-title" style="margin-top:18px">精算の記録</h2>` + settlementHistory(settlements.slice(0,30));
  el.innerHTML = html;
  el.querySelectorAll('.person-row').forEach(b=>b.onclick=()=>{ settleView=b.dataset.pid; renderSettle(); window.scrollTo(0,0); });
  $('advAdd').onclick = addAdvance;
  bindSettlementCards(el);

function settlementHistory(list){
  if (!list.length) return `<div class="empty" style="padding:20px">まだ精算の記録はありません</div>`;
  return list.map(s=>{
    const name = payerName(s.payerId);
    return `<div class="settle-card" data-sid="${s.id}">
      <div class="s-top">
        <div><div style="font-weight:700">${esc(s.no||'')} ${isP()?'':esc(name)+'さん'}</div>
        <div class="hint" style="margin:2px 0 0">${fmtDateFull(s.date)}・${esc(s.way)}・伝票${Object.keys(s.entryIds||{}).length}件${s.adv?`・仮払 ${yen(s.adv)}相殺`:''}</div></div>
        <div style="text-align:right"><div class="num" style="font-size:17px">${yen(Math.abs(s.net))}</div><div class="direction">${directionText(s.net, isP()?'あなた':name).replace('あなたさん','あなた')}</div></div>
      </div>
      <div class="tags">${s.payerConfirm ? `<span class="stamp-tag" style="border-color:var(--moss);color:var(--moss)">本人確認済 ${fmtTs(s.payerConfirm.at)}</span>` : `<span class="stamp-tag" style="border-color:var(--amber);color:var(--amber)">本人の確認待ち</span>`}</div>
      <div class="btn-row">
        <button class="btn btn-ghost sm" data-act="print">精算書を印刷</button>
        ${isP() && !s.payerConfirm ? `<button class="btn btn-moss sm" data-act="confirm">${s.net>=0?'受け取りました':'返金しました'}</button>` : ''}
        ${isT() && !s.payerConfirm ? `<button class="btn btn-danger sm" data-act="cancel">取り消す</button>` : ''}
      </div>
    </div>`;
  }).join('');
}
function bindSettlementCards(el){
  el.querySelectorAll('.settle-card').forEach(card=>{
    const s = settlements.find(x=>x.id===card.dataset.sid);
    card.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
      if (b.dataset.act==='print') printSettlement(s);
      if (b.dataset.act==='confirm') confirmSettlement(s);
      if (b.dataset.act==='cancel') cancelSettlement(s);
    });
  });
}

    <h2 class="section-title">${esc(payerLabel(pid))}さんの精算</h2>
    <div class="form-card">
      ${p.approved.length ? `<div style="font-weight:700;font-size:13px;margin-bottom:4px">立替・仮払で支払った分</div>` : ''}
      ${p.approved.map(e=>`<label class="check-row"><input type="checkbox" class="st-e" value="${e.id}" data-amt="${e.amount}" checked>
        <span class="c-body"><span class="voucher">${esc(e.voucherNo)}</span>${esc(e.purpose||e.payee||'')}<span class="hint" style="display:block;margin:0">${fmtDate(e.date)} ${esc(methodById(e.methodId)?.name||'')}</span></span>
        <span class="c-amt">${yen(e.amount)}</span></label>`).join('')}
      ${p.advs.length ? `<div style="font-weight:700;font-size:13px;margin:12px 0 4px">預けている仮払金</div>` : ''}

      ${p.waiting.length ? `<p class="hint">ほかに承認待ち・差戻し中が ${p.waiting.length}件あります。承認すると精算に含められます。</p>` : ''}
      ${!p.approved.length && !p.advs.length ? `<p class="hint">精算できる承認済みの伝票はありません。</p>` : ''}
      <div class="net-box"><div class="d" id="stDir"></div><div class="v" id="stNet"></div></div>
      <div class="field"><label>精算日</label><input type="date" id="stDate" value="${localDate()}"></div>
      <div class="field"><label>精算方法</label><select id="stWay">${SETTLE_WAYS.map(w=>`<option>${w}</option>`).join('')}</select></div>
      <div class="field"><label>メモ</label><input type="text" id="stMemo" placeholder="例）役員会の後に手渡し"></div>

      <p class="hint">記録すると、${esc(py.name)}さんの画面に確認ボタンが表示されます。双方の確認で精算が完了します。</p>
    </div>`;
  if (p.advs.length) html += `<div class="panel"><h3>仮払金の記録を消す <small>誤って登録したとき</small></h3>${p.advs.map(a=>`<div class="cat-row"><span class="cname">${esc(a.memo||'仮払金')} <small>${fmtDate(a.date)}</small></span><span class="num">${yen(a.amount)}</span><button class="lnk" data-adv="${a.id}">削除</button></div>`).join('')}</div>`;
  html += `<h2 class="section-title" style="margin-top:16px">これまでの精算</h2>` + settlementHistory(settlements.filter(s=>s.payerId===pid));
  el.innerHTML = html;

  const recalc = () => {
    const sum = sel => [...el.querySelectorAll(sel+':checked')].reduce((s,x)=>s+Number(x.dataset.amt),0);
    const net = sum('.st-e') - sum('.st-a');
    $('stDir').textContent = directionText(net, py.name);
    $('stNet').textContent = yen(Math.abs(net));
    $('stNet').style.color = net>=0 ? 'var(--stamp-navy)' : 'var(--stamp-red)';
    return net;
  };
  el.querySelectorAll('.st-e,.st-a').forEach(c=>c.onchange=recalc);

async function addAdvance(){
  const pid = $('advPayer').value, amount = Math.round(Number($('advAmount').value)||0), date = $('advDate').value;
  if (!pid) return showToast('渡す相手を選んでください');
  if (amount<=0) return showToast('金額を入力してください');
  await R('advances').push().set({ payerId:pid, date, amount, memo:$('advMemo').value.trim(), settleState:'pending', createdBy:me.uid, createdByName:me.name, createdAt:TS() });
  writeLog('仮払', null, `${payerName(pid)}さんへ ${yen(amount)} ${$('advMemo').value.trim()}`);
  showToast('仮払金を記録しました');
}

async function doSettlement(pid, recalc){
  const el = $('settleScreen');
  const eIds = [...el.querySelectorAll('.st-e:checked')].map(x=>x.value);
  const aIds = [...el.querySelectorAll('.st-a:checked')].map(x=>x.value);
  if (!eIds.length && !aIds.length) return showToast('精算する項目を選んでください');
  const net = recalc();
  const way = $('stWay').value, date = $('stDate').value;
  if (!confirm(`${directionText(net, payerName(pid))}\n${yen(Math.abs(net))}（${way}）\nこの内容で精算を記録しますか？`)) return;
  const btn = $('stDo'); btn.disabled = true;
  try {
    const fy = fyOf(date);
    const tx = await R(`counters/S${fy}`).transaction(n=>(n||0)+1);
    const no = `精${fy}-${pad(tx.snapshot.val(),3)}`;
    const sid = R('settlements').push().key;
    const es = eIds.map(entryById);
    const as = aIds.map(id=>advances.find(a=>a.id===id));
    const spent = es.reduce((s,e)=>s+(Number(e.amount)||0),0), adv = as.reduce((s,a)=>s+(Number(a.amount)||0),0);
    const ups = {};
    ups[`settlements/${sid}`] = {
      no, payerId:pid, date, way, memo:$('stMemo').value.trim(), spent, adv, net: spent-adv,
      entryIds: Object.fromEntries(eIds.map(i=>[i,true])), advanceIds: Object.fromEntries(aIds.map(i=>[i,true])),
      items: es.map(e=>({voucherNo:e.voucherNo, date:e.date, purpose:e.purpose||e.payee||'', method:methodById(e.methodId)?.name||'', amount:Number(e.amount)||0})),
      advItems: as.map(a=>({date:a.date, memo:a.memo||'仮払金', amount:Number(a.amount)||0})),
      createdBy:me.uid, createdByName:me.name, createdAt:TS()
    };
    eIds.forEach(id=>{ ups[`entries/${id}/settleState`]='settled'; ups[`entries/${id}/settlementId`]=sid; });
    aIds.forEach(id=>{ ups[`advances/${id}/settleState`]='settled'; ups[`advances/${id}/settlementId`]=sid; });
    await db.ref(ROOT).update(ups);
    writeLog('精算', null, `${no} ${payerName(pid)} ${directionText(spent-adv,'')} ${yen(Math.abs(spent-adv))}`);
    showToast('精算を記録しました');
    if (confirm('精算書を印刷しますか？（受領印をもらう場合）')) printSettlement({...ups[`settlements/${sid}`], id:sid, createdAt:Date.now()});
  } catch(e){ console.error(e); showToast('精算の記録に失敗しました'); btn.disabled=false; }
}

async function cancelSettlement(s){
  if (!confirm(`${s.no} を取り消しますか？\n対象の伝票は「精算待ち」に戻ります。`)) return;
  const ups = {};
  Object.keys(s.entryIds||{}).forEach(id=>{ ups[`entries/${id}/settleState`]='pending'; ups[`entries/${id}/settlementId`]=null; });
  Object.keys(s.advanceIds||{}).forEach(id=>{ ups[`advances/${id}/settleState`]='pending'; ups[`advances/${id}/settlementId`]=null; });
  ups[`settlements/${s.id}`] = null;
  await db.ref(ROOT).update(ups);
  writeLog('精算取消', null, `${s.no} ${payerName(s.payerId)} ${yen(Math.abs(s.net))}`);
  showToast('精算を取り消しました');
}
async function confirmSettlement(s){
  if (!confirm(`${s.net>=0?`${yen(s.net)} を受け取りました`:`${yen(-s.net)} を返金しました`}。よろしいですか？`)) return;
  await R(`settlements/${s.id}/payerConfirm`).set({ at:TS(), name:me.name, uid:me.uid });
  writeLog('精算確認', null, `${s.no} ${me.name}`);
  showToast('確認しました。ありがとうございました');
}

function renderPayerSettle(el){
  if (!me.payerId) { el.innerHTML = '<div class="empty">支払者名簿との紐付け後に使えます</div>'; return; }
  const p = payerBalance(me.payerId);
  let html = `<div class="net-box"><div class="d">${p.ready ? directionText(p.net,'あなた').replace('あなたさん','あなた') : '精算待ちはありません'}</div><div class="v">${yen(Math.abs(p.net))}</div>
    <div class="hint">会計と会うときに、この画面を見せ合って確認できます</div></div>`;
  if (p.approved.length) html += `<h2 class="section-title">精算待ち（承認済み）</h2>` + p.approved.map(slipHTML).join('');
  if (p.waiting.length) html += `<h2 class="section-title" style="margin-top:14px">承認待ち・差戻し</h2>` + p.waiting.map(slipHTML).join('');
  if (p.advs.length) html += `<h2 class="section-title" style="margin-top:14px">預かっている仮払金</h2>` + p.advs.map(a=>`<div class="cat-row"><span class="cname">${esc(a.memo||'仮払金')}<small>${fmtDateFull(a.date)}に受け取り</small></span><span class="num">${yen(a.amount)}</span></div>`).join('');
  html += `<h2 class="section-title" style="margin-top:16px">精算の記録</h2>` + settlementHistory(settlements);
  el.innerHTML = html;
  bindSlips(el); bindSettlementCards(el);
}

/* =========================================================
   監査
   ========================================================= */
function autoChecks(ap){
  const out = [];
  const noPhoto = ap.filter(e=>e.type==='expense' && !e.photoCount && !e.noReceipt);
  if (noPhoto.length) out.push({ label:'写真も「領収証なし」理由もない支出', list:noPhoto });
  const noRc = ap.filter(e=>e.noReceipt);
  if (noRc.length) out.push({ label:'領収証なしの支出（理由を確認）', list:noRc });
  const seen = {}, dup = new Set();
  ap.forEach(e=>{ const k=`${e.date}|${e.amount}|${(e.payee||'').trim()}`; if (seen[k]) { dup.add(seen[k]); dup.add(e); } else seen[k]=e; });
  if (dup.size) out.push({ label:'同じ日・同じ金額・同じ支払先（二重登録の可能性）', list:[...dup] });
  const limit = new Date(); limit.setDate(limit.getDate()-60);
  const old = ap.filter(e=>e.settleState==='pending' && e.date < localDate(limit));
  if (old.length) out.push({ label:'60日以上精算されていない立替', list:old });
  const over = accounts.filter(a=>a.type==='expense').map(a=>{ const b=Number((a.budget||{})[curFY])||0; const act=ap.filter(e=>e.accountId===a.id).reduce((s,e)=>s+(Number(e.amount)||0),0); return {a,b,act}; }).filter(x=>x.b && x.act>x.b);
  if (over.length) out.push({ label:'予算を超えた科目', text: over.map(x=>`${x.a.name}：${yen(x.act)}／予算${yen(x.b)}`).join('、') });
  return out;
}

function renderAudit(){
  const el = $('auditScreen');
  if (!isStaff()) { el.innerHTML=''; return; }
  const ap = approvedFY().sort((a,b)=>(a.voucherNo||'')<(b.voucherNo||'')?-1:1);
  const ok = ap.filter(e=>e.audit && !e.auditStale && e.audit.result==='ok');
  const issue = ap.filter(e=>e.audit && !e.auditStale && e.audit.result==='issue');
  const todo = ap.filter(e=>!e.audit || e.auditStale);
  const pct = ap.length ? Math.round((ok.length+issue.length)/ap.length*100) : 0;
  const report = auditReports[curFY];

  let html = `<div class="panel"><div class="progress-ring"><span class="pct">${pct}%</span>
      <div style="flex:1"><div class="bar"><i style="width:${pct}%;background:var(--stamp-navy)"></i></div>
      <div class="hint">承認済み ${ap.length}件　確認済み ${ok.length}件　指摘 ${issue.length}件　未確認 ${todo.length}件</div></div></div>
      ${report ? `<p style="margin:10px 0 0;font-size:13px;color:var(--moss);font-weight:700">✓ ${curFY}年度の監査完了（${fmtTs(report.at)} ${esc(report.byName)}）</p>${report.comment?`<p class="hint">${esc(report.comment)}</p>`:''}` : ''}
    </div>`;

  const checks = autoChecks(ap);
  html += `<div class="panel"><h3>自動チェック <small>監査の手がかり</small></h3>` + (checks.length ? checks.map((c,i)=>`
    <details style="margin-bottom:8px"><summary style="font-size:13px;cursor:pointer">⚠ ${esc(c.label)}${c.list?`（${c.list.length}件）`:''}</summary>
    ${c.list ? `<div style="margin-top:8px">${c.list.map(slipHTML).join('')}</div>` : `<p class="hint">${esc(c.text)}</p>`}</details>`).join('') : `<p class="hint" style="margin:0">気になる点は見つかりませんでした</p>`) + `</div>`;

  html += `<div class="panel"><h3>書類の出力</h3>
    <div class="btn-row" style="flex-wrap:wrap">
      <button class="btn btn-ghost sm" id="outCsv">出納帳CSV（Excel）</button>
      <button class="btn btn-ghost sm" id="outVouchers">証憑台帳を印刷</button>
      <button class="btn btn-ghost sm" id="outReport">収支決算書を印刷</button>
    </div>
    <p class="hint">証憑台帳は伝票番号順に写真付きで並びます。紙への貼り付け・Excelへの転記の代わりにお使いください。領収証の原本には同じ伝票番号を書いておくと照合が楽です。</p></div>`;

  if (isA()) html += `<button class="btn ${report?'btn-ghost':'btn-navy'} full" id="auditDone" style="margin-bottom:14px">${report?'監査完了の記録を更新する':`${curFY}年度の監査を完了する`}</button>`;

  const f = auditFilter;
  const list = f==='todo' ? todo : f==='issue' ? issue : f==='ok' ? ok : ap;
  html += `<div class="filter-bar">${[['todo','未確認',todo.length],['issue','指摘',issue.length],['ok','確認済み',ok.length],['all','すべて',ap.length]].map(([k,l,n])=>`<button class="chip ${f===k?'active':''}" data-f="${k}">${l}<span class="cnt">${n}</span></button>`).join('')}</div>`;
  html += list.length ? list.map(slipHTML).join('') : `<div class="empty" style="padding:24px">該当する伝票はありません</div>`;

  html += `<details class="panel" style="margin-top:16px"><summary style="font-family:'Shippori Mincho',serif;font-weight:700;cursor:pointer">操作履歴（直近${Math.min(logs.length,300)}件）</summary>
    <p class="hint">登録・修正・削除・承認・精算のすべてが自動で記録され、誰も書き換えや削除ができません。</p>
    <div class="history" style="margin-top:8px">${logs.map(l=>`<div style="border-bottom:1px dashed var(--line);padding:4px 0">${fmtTs(l.at)}　<b style="color:var(--ink)">${esc(l.action)}</b>　${esc(l.name)}　${esc(l.voucherNo||'')} ${l.amount?yen(l.amount):''}<br>${esc(l.detail||'')}</div>`).join('') || 'まだありません'}</div></details>`;

  el.innerHTML = html;
  bindSlips(el);
  el.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{ auditFilter=c.dataset.f; renderAudit(); });
  $('outCsv').onclick = exportCsv;
  $('outVouchers').onclick = printVouchers;
  $('outReport').onclick = printReport;
  if ($('auditDone')) $('auditDone').onclick = async () => {
    if (todo.length && !confirm(`未確認の伝票が${todo.length}件あります。それでも完了にしますか？`)) return;
    const comment = prompt('監査の所見（会員向け報告にも表示されます）', '帳簿・証憑を照合した結果、適正に処理されていることを確認しました。');
    if (comment===null) return;
    await R(`auditReports/${curFY}`).set({ at:TS(), by:me.uid, byName:me.name, comment:comment.trim(), okCount:ok.length, issueCount:issue.length, total:ap.length });
    writeLog('監査完了', null, `${curFY}年度 ${comment}`);
    showToast('監査完了を記録しました');
  };
}

/* ---------- 出納帳CSV ---------- */
function ledgerRows(){
  const opening = Number((settings.opening||{})[curFY])||0;
  let bal = opening;
  return approvedFY().sort((a,b)=>a.date===b.date?((a.voucherNo||'')<(b.voucherNo||'')?-1:1):(a.date<b.date?-1:1)).map(e=>{
    const amt = Number(e.amount)||0;
    bal += e.type==='income' ? amt : -amt;
    const stl = e.settlementId ? settlements.find(s=>s.id===e.settlementId) : null;
    return { e, bal, stl };
  });
}
function exportCsv(){
  const head = ['伝票番号','日付','区分','科目','用途・行事','支払先・入金元','支払方法','支払った人','収入','支出','残高','精算状況','精算日','精算番号','領収証','原本保管場所','監査','監査コメント','登録者','メモ'];
  const opening = Number((settings.opening||{})[curFY])||0;
  const rows = [head, ['', '', '', '前年度繰越金', '', '', '', '', opening, '', opening]];
  ledgerRows().forEach(({e,bal,stl})=>{
    rows.push([
      e.voucherNo, e.date, e.type==='income'?'収入':'支出', accById(e.accountId)?.name||'', e.purpose||'', e.payee||'',
      methodById(e.methodId)?.name||'', payerLabel(e.payerId), e.type==='income'?e.amount:'', e.type==='expense'?e.amount:'', bal,
      e.type==='expense' ? (e.settleState==='pending'?'未精算':e.settleState==='settled'?'精算済':'不要') : '',
      stl?stl.date:'', stl?stl.no:'', e.noReceipt?`なし（${e.noReceiptReason}）`:(e.photoCount?`写真${e.photoCount}枚`:'写真なし'),
      e.storageLocation||'', e.audit?(e.auditStale?'要再確認':e.audit.result==='ok'?'確認済':'指摘'):'未確認', e.audit?.comment||'',
      e.createdByName||'', e.memo||''
    ]);
  });
  const csv = '\uFEFF' + rows.map(r=>r.map(v=>{ const s=String(v??''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = `出納帳_${settings.orgName}_${curFY}年度.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  showToast('CSVを書き出しました');
}

      <div class="btn-row"><button class="btn btn-ghost" id="pubStop">${curFY}年度の公開を止める</button><button class="btn btn-primary" id="pubDo">${curFY}年度の報告を更新</button></div>
      <div class="inline-add"><input readonly value="${esc(publicUrl())}" id="pubUrl"><button class="btn btn-ghost sm" id="pubCopy">コピー</button></div>
      <p class="hint">公開内容は自動では変わりません。月に一度など、区切りのよいときに「報告を更新」を押してください。回覧板のQRコードにこのURLを載せると便利です。</p></div>`;
  } else {
    html += `<div class="form-card"><p style="margin:0">${esc(me.name)}（${esc(me.email)}）</p><p class="hint">権限：${ROLES[me.role]?.name}　${ROLES[me.role]?.desc}${me.payerId?`<br>支払者名簿：${esc(payerLabel(me.payerId))}`:''}</p></div>
      <h2 class="section-title" style="margin-top:16px">会員向けの会計報告</h2><div class="form-card"><div class="inline-add" style="margin:0"><input readonly value="${esc(publicUrl())}" id="pubUrl"><button class="btn btn-ghost sm" id="pubCopy">コピー</button></div></div>`;
  }

  html += `<h2 class="section-title" style="margin-top:20px">AI自動入力（この端末の設定）</h2><div class="form-card">
    <p class="hint" style="margin-top:0">Claude APIキーはこの端末のブラウザ内にだけ保存され、町内会のデータベースには送られません。</p>
    <div class="field"><label>Claude APIキー</label><input type="password" id="apiKeyInput" placeholder="sk-ant-..."></div>
    <p class="hint" style="margin-top:-6px">${getApiKey()?`設定済み（${esc(getApiKey().slice(0,10))}…）`:'未設定'}</p>
    <div class="btn-row"><button class="btn btn-ghost" id="delKey">削除</button><button class="btn btn-primary" id="saveKey">保存</button></div></div>
    <button class="btn btn-ghost full" style="margin-top:6px" onclick="if(confirm('ログアウトしますか？'))auth.signOut()">ログアウト</button>`;
  el.innerHTML = html;
  bindSettings();
}

function bindSettings(){
  const q = s => $('settingsScreen').querySelectorAll(s);
  if ($('pubCopy')) $('pubCopy').onclick = () => { navigator.clipboard?.writeText(publicUrl()).then(()=>showToast('URLをコピーしました')).catch(()=>{ $('pubUrl').select(); }); };
  $('saveKey').onclick = () => { const v=$('apiKeyInput').value.trim(); if(!v) return showToast('APIキーを入力してください'); try{localStorage.setItem(API_KEY_STORAGE,v);}catch(e){} showToast('保存しました'); renderSettings(); };
  $('delKey').onclick = () => { try{localStorage.removeItem(API_KEY_STORAGE);}catch(e){} showToast('削除しました'); renderSettings(); };
  if (!isT()) return;

  $('sSaveOrg').onclick = async () => {
    await R('settings').update({ orgName:$('sOrg').value.trim()||'町内会', fiscalStartMonth:Number($('sStart').value) });
    await R(`settings/opening/${curFY}`).set(Math.round(Number($('sOpening').value)||0));
    writeLog('設定変更', null, `団体名・年度・${curFY}年度繰越金`);
    showToast('保存しました');
  };
  q('[data-budget]').forEach(inp => inp.onchange = async () => {
    const v = inp.value==='' ? null : Math.round(Number(inp.value)||0);
    await R(`accounts/${inp.dataset.budget}/budget/${curFY}`).set(v);
    writeLog('予算設定', null, `${accById(inp.dataset.budget)?.name} ${curFY}年度 ${v===null?'未設定':yen(v)}`);
    showToast('予算を保存しました');
  });
  q('[data-rename]').forEach(b => b.onclick = () => { const a=accById(b.dataset.rename); const n=prompt('科目名', a.name); if(n&&n.trim()) R(`accounts/${a.id}/name`).set(n.trim()); });
  q('[data-toggleacc]').forEach(b => b.onclick = () => { const a=accById(b.dataset.toggleacc); R(`accounts/${a.id}/active`).set(!a.active); });
  $('addAcc').onclick = async () => {
    const name=$('newAccName').value.trim(); if(!name) return showToast('科目名を入力してください');
    const type=$('newAccType').value;
    await R('accounts').push().set({ name, type, color:PALETTE[accounts.length%PALETTE.length], active:true, order:(type==='income'?100:0)+accounts.length });
    document.activeElement.blur(); showToast('科目を追加しました'); renderSettings();
  };
  q('[data-settle]').forEach(b => b.onclick = () => { const m=methodById(b.dataset.settle); if(confirm(`「${m.name}」を${m.settle?'精算不要':'要精算'}にしますか？\n（これから登録する伝票に反映されます）`)) R(`methods/${m.id}/settle`).set(!m.settle); });
  q('[data-togglem]').forEach(b => b.onclick = () => { const m=methodById(b.dataset.togglem); R(`methods/${m.id}/active`).set(!m.active); });
  $('addM').onclick = async () => {
    const name=$('newMName').value.trim(); if(!name) return showToast('支払方法の名前を入力してください');
    await R('methods').push().set({ name, use:$('newMUse').value, settle:$('newMSettle').checked, active:true, order:methods.length });
    document.activeElement.blur(); showToast('支払方法を追加しました'); renderSettings();
  };
  q('[data-editp]').forEach(b => b.onclick = () => {
    const p=payerById(b.dataset.editp);
    const n=prompt('氏名', p.name); if(n===null) return;
    const post=prompt('役職（例：3班 班長、防災支隊長）', p.post||''); if(post===null) return;
    R(`payers/${p.id}`).update({ name:n.trim()||p.name, post:post.trim() });
  });
  q('[data-togglep]').forEach(b => b.onclick = () => { const p=payerById(b.dataset.togglep); R(`payers/${p.id}/active`).set(!p.active); });
  $('addP').onclick = async () => {
    const name=$('newPName').value.trim(); if(!name) return showToast('氏名を入力してください');
    await R('payers').push().set({ name, post:$('newPPost').value.trim(), active:true, createdAt:TS() });
    $('newPName').value=''; $('newPPost').value=''; document.activeElement.blur(); showToast('名簿に追加しました'); renderSettings();
  };
  q('[data-role]').forEach(s => s.onchange = async () => {
    const m = members.find(x=>x.id===s.dataset.role);
    await R(`members/${m.id}/role`).set(s.value);
    writeLog('権限変更', null, `${m.name}：${ROLES[m.role]?.name}→${ROLES[s.value]?.name}`);
    showToast(`${m.name}さんを「${ROLES[s.value].name}」にしました`);
  });
  q('[data-link]').forEach(s => s.onchange = async () => {
    const m = members.find(x=>x.id===s.dataset.link);
    await R(`members/${m.id}/payerId`).set(s.value || null);
    writeLog('名簿紐付け', null, `${m.name} → ${payerLabel(s.value)||'なし'}`);
    showToast('紐付けを保存しました');
  });
  $('pubDetail').onchange = () => R('settings/publicDetail').set($('pubDetail').value);
  $('pubDo').onclick = publishReport;
  $('pubStop').onclick = async () => {
    if (!confirm(`${curFY}年度の会計報告を非公開にしますか？`)) return;
    await R(`public/${curFY}`).remove(); await R(`public/index/years/${curFY}`).remove();
    showToast('非公開にしました');
  };
}

async function publishReport(){
  const ap = approvedFY();
  const opening = Number((settings.opening||{})[curFY])||0;
  const accs = accounts.filter(a=>a.active || ap.some(e=>e.accountId===a.id)).map(a=>({
    name:a.name, type:a.type, color:a.color, budget:Number((a.budget||{})[curFY])||0,
    actual: ap.filter(e=>e.accountId===a.id).reduce((s,e)=>s+(Number(e.amount)||0),0)
  })).filter(a=>a.budget||a.actual);
  const months = fyMonths(curFY).map(m=>({ label:`${m.m}月`, expense: ap.filter(e=>e.type==='expense' && e.date.startsWith(m.key)).reduce((s,e)=>s+(Number(e.amount)||0),0) }));
  const inc = ap.filter(e=>e.type==='income').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const exp = ap.filter(e=>e.type==='expense').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const detail = (settings.publicDetail||'items')==='items';
  const items = detail ? ap.sort((a,b)=>a.date<b.date?-1:1).map(e=>({
    date:e.date, type:e.type, account:accById(e.accountId)?.name||'',
    purpose: e.excludePublic ? '（個人に関わるため明細省略）' : (e.purpose || accById(e.accountId)?.name || ''),
    amount:Number(e.amount)||0
  })) : null;
  const pending = ap.filter(e=>e.settleState==='pending').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const report = auditReports[curFY] ? { at:auditReports[curFY].at, byName:auditReports[curFY].byName, comment:auditReports[curFY].comment } : null;
  await R(`public/${curFY}`).set({ orgName:settings.orgName, fy:curFY, range:fyRangeLabel(curFY), opening, income:inc, expense:exp, balance:opening+inc-exp, pendingReimburse:pending, accounts:accs, months, items, audit:report, count:ap.length, updatedAt:TS() });
  await R('public/index').update({ orgName:settings.orgName, [`years/${curFY}`]: true });
  writeLog('会計報告公開', null, `${curFY}年度 ${ap.length}件`);
  showToast('会員向けの報告を更新しました');
}

/* =========================================================
   会員向け公開レポート（ログイン不要）
   ========================================================= */
async function openPublic(){
  hideAllRoots(); $('publicScreen').style.display='block';
  const body = $('publicBody');
  if (!CONFIGURED) { body.innerHTML = '<div class="empty">まだ準備中です</div>'; return; }
  body.innerHTML = '<div class="empty">読み込み中…</div>';
  try {
    const idx = (await db.ref(`${ROOT}/public/index`).get()).val();
    const years = Object.keys((idx&&idx.years)||{}).map(Number).sort((a,b)=>b-a);
    if (!years.length) { body.innerHTML = `<div class="pub-head"><div class="org">${esc(idx?.orgName||'町内会')}</div></div><div class="empty">まだ会計報告は公開されていません</div>`; return; }
    const want = Number(params.get('fy')) || years[0];
    renderPublic(years, years.includes(want) ? want : years[0]);
  } catch(e){ console.error(e); body.innerHTML = '<div class="empty">読み込めませんでした。時間をおいてもう一度開いてください。</div>'; }
}
async function renderPublic(years, fy){
  const body = $('publicBody');
  const d = (await db.ref(`${ROOT}/public/${fy}`).get()).val();
  if (!d) { body.innerHTML = '<div class="empty">この年度の報告はありません</div>'; return; }
  const maxM = Math.max(1, ...asList(d.months).map(m=>m.expense));
  const accRows = t => asList(d.accounts).filter(a=>a.type===t).map(a=>{
    const pct = a.budget ? Math.min(100, a.actual/a.budget*100) : 100;
    return `<div class="bar-row"><div class="bl"><span>${esc(a.name)}</span><span class="num">${yen(a.actual)}${a.budget?` ／ 予算 ${yen(a.budget)}`:''}</span></div><div class="bar"><i style="width:${pct}%;background:${a.color}"></i></div></div>`;
  }).join('');
  let html = `<div class="pub-head"><div class="mark-big" style="margin:0 auto 12px;width:60px;height:60px;font-size:12px">会計<br>報告</div>
    <div class="org">${esc(d.orgName)}</div><div class="ttl">${d.fy}年度 会計報告（${esc(d.range)}）</div>
    ${d.audit?`<div class="audited">監査済　${esc(d.audit.byName)}</div>`:''}</div>
    ${years.length>1?`<div class="filter-bar" style="justify-content:center">${years.map(y=>`<button class="chip ${y===fy?'active':''}" data-y="${y}">${y}年度</button>`).join('')}</div>`:''}
    <div class="summary-strip">
      <div><div class="lbl">前年度繰越</div><div class="val">${yen(d.opening)}</div></div>
      <div><div class="lbl">収入</div><div class="val" style="color:var(--stamp-navy)">${yen(d.income)}</div></div>
      <div><div class="lbl">支出</div><div class="val" style="color:var(--stamp-red)">${yen(d.expense)}</div></div>
      <div><div class="lbl">残高</div><div class="val big">${yen(d.balance)}</div></div>
    </div>
    <div class="panel"><h3>会費などの使いみち <small>科目別の支出</small></h3>${accRows('expense')||'<p class="hint">まだ支出はありません</p>'}</div>
    <div class="panel"><h3>月ごとの支出</h3><div class="mbars">${asList(d.months).map(m=>`<div class="mb" title="${m.label} ${yen(m.expense)}"><i style="height:${m.expense/maxM*100}%"></i><span>${m.label.replace('月','')}</span></div>`).join('')}</div></div>
    <div class="panel"><h3>収入の内訳</h3>${accRows('income')||'<p class="hint">まだ収入はありません</p>'}</div>`;
  if (d.items) html += `<div class="panel"><h3>明細 <small>${asList(d.items).length}件</small></h3><div class="tbl-wrap"><table class="pub"><thead><tr><th>日付</th><th>科目</th><th>用途</th><th class="r">金額</th></tr></thead><tbody>
    ${asList(d.items).map(i=>`<tr><td style="white-space:nowrap">${fmtDate(i.date)}</td><td>${esc(i.account)}</td><td>${esc(i.purpose)}</td><td class="r" style="color:${i.type==='income'?'var(--stamp-navy)':'inherit'}">${i.type==='income'?'+':''}${yen(i.amount)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  if (d.audit && d.audit.comment) html += `<div class="panel"><h3>監査報告</h3><p style="margin:0;font-size:13.5px;line-height:1.7">${esc(d.audit.comment)}</p></div>`;
  html += `<p class="hint" style="text-align:center">最終更新 ${fmtTs(d.updatedAt)}　／　支払先・個人名・領収証の画像は掲載していません。<br>領収証の原本は会計担当が保管しています。ご質問は役員までお寄せください。</p>
    <div style="text-align:center"><button class="text-link" onclick="location.href=location.pathname">役員の方はこちら（ログイン）</button></div>`;
  body.innerHTML = html;
  body.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>renderPublic(years, Number(b.dataset.y)));
}
</script>
