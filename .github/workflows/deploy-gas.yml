name: Deploy GAS

on:
  push:
    branches:
      - main
    paths:
      - "gas/**"
      - ".github/workflows/deploy-gas.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Setup clasp authentication
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Create clasp project settings
        working-directory: gas
        run: |
          cat > .clasp.json <<'EOF'
          {
            "scriptId": "${{ secrets.GAS_SCRIPT_ID }}",
            "rootDir": "."
          }
          EOF

      - name: Push to Apps Script
        working-directory: gas
        run: clasp push --force

      - name: Redeploy existing web app
        working-directory: gas
        run: |
          clasp deploy \
            --deploymentId "${{ secrets.GAS_DEPLOYMENT_ID }}" \
            --description "GitHub ${GITHUB_SHA}"
